[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "kpi_management"
authors = [{name = "SF Group"}]
description = "KPI agreements, employee assessments and controlled reviews for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "license.txt"}
dynamic = ["version"]
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
hrms = ">=15.0.0,<16.0.0"

[tool.flit.sdist]
include = ["kpi_management/", "docs/", "tests/", "tools/", "README.md", "CHANGELOG.md", "MANIFEST.in"]
